name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://urbanspoon:urbanspoon_dev@localhost:5432/urbanspoon?schema=public
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: Urban Spoon <no-reply@urbanspoon.local>
      AUTH_TOKEN_SECRET: ci-only-auth-token-secret-do-not-use-in-production
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: urbanspoon
          POSTGRES_USER: urbanspoon
          POSTGRES_PASSWORD: urbanspoon_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbanspoon -d urbanspoon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm --filter @urbanspoon/api db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
